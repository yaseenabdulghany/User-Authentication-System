<!DOCTYPE html>
<html>

<head>
  <title>Sign Up Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="parent">
    <div class="logo"> <img src="Google_2015_logo.svg" alt=""></div>
    <div class="sign">Sign up</div>
    <div class="cont">to continue to gmail</div>
    <form id="signupForm">
      <div class="use">
        <input class="username" type="text" id="first" placeholder="FirstName" name="firstname" required>
      </div>
      <div class="use">
        <input class="username" type="text" id="last" placeholder="LastName" name="lastname" required>
      </div>
      <div class="use">
        <input class="username" type="email" id="username" placeholder="Email or phone" name="username" required>
      </div>
      <br>
      <div style="margin-bottom: 45px;">
        <input class="password" type="password" id="password" placeholder="Password" name="password" minlength="8"
          required>
      </div>
      <p class="text">Not your computer? Use Guest mode to sign in privately.</p>
      <p class="learn">Learn more</p>
      <br>
      <p class="learn" style="display: inline-block; width: calc(65%); margin-left: -5%;"></p>
      <button type="submit">Next</button>
      <br>
      <br>
    </form>
  </div>

  <script>
    document.getElementById("signupForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const firstname = document.getElementById("first").value;
      const lastname = document.getElementById("last").value;
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch('http://localhost:3000/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password , firstname , lastname})
        });

        const result = await response.text();

        if (response.ok) {
          window.location.href = 'signin.html';
        } else {
          alert('Error: ' + result);
        }
      } catch (error) {
        alert('Error: ' + error);
      }
    });
  </script>
</body>

</html>
